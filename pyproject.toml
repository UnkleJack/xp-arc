[project]
name = "xp-arc"
version = "0.3.0"
description = "Constitutional multi-agent orchestration protocol"
readme = "README.md"
authors = [{name = "David J. Riedl", email = "david@unclejack.xyz"}]
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
classifiers = [
    "License :: OSI Approved :: Apache Software License",
]
dependencies = [
    "pytz",
    "requests",
    "certifi",
    "cryptography>=48.0.1",
    "aiohttp>=3.9",
]

[project.optional-dependencies]
broker = ["redis"]
asset-engine = [
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "sqlite-utils>=3.37",
    "httpx>=0.27",
    "openai>=1.30",
    "playwright>=1.45",
    "watchdog>=4.0",
    "rich>=13.7",
    "typer>=0.12",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]
competitive-intel = [
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "feedparser>=6.0",
    "httpx>=0.27",
]
gauntlet = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "bandit",
    "ruff",
    "mypy",
]
all = ["xp-arc[broker,asset-engine,competitive-intel,gauntlet]"]

[project.scripts]
xp-arc-gauntlet = "gauntlet_pkg:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools.packages.find]
where = ["."]
include = ["xp_arc*", "gauntlet*"]
exclude = ["tests*", "asset-engine*", "docs*", "examples*", "data*", "templates*"]
