# ============================================================================
# USER PREFERENCES
# ============================================================================
user_preferences:
  # Minimum severity to include in weekly report
  report_min_severity: "low"

  # Max events per competitor per day in report
  max_events_per_competitor_per_day: 5

  # Include raw payload in events (for debugging)
  include_raw_payload: true

  # Auto-generate GitHub issues for high/critical gaps
  auto_create_issues: false

  # Notification channels (for future integration)
  notifications:
    slack_webhook: ""
    discord_webhook: ""
    email: ""

  # Timezone for scheduling
  timezone: "America/Los_Angeles"