# ============================================================================
# SOURCE-SPECIFIC OVERRIDES
# ============================================================================
source_overrides:
  github:
    # Additional repos to watch beyond competitor-owned
    extra_repos:
      - "microsoft/semantic-kernel"
      - "nvidia/nemotron"
      - "huggingface/transformers"
      - "huggingface/trl"
    # Ignore these repos (too noisy, low relevance)
    ignore_repos:
      - "langchain-ai/langchainjs"  # JS port, less relevant
      - "langchain-ai/langchain-python"  # core, too high volume

  x_twitter:
    # Additional accounts for ecosystem pulse
    extra_accounts:
      - "simonw"
      - "karpathy"
      - "ylecun"
      - "anthrupad"
      - "gdb"
      - "hardmaru"
      - "omarsar0"
      - "jxnlco"
      - "hamelhusain"
      - "eugeneyan"
    # Mute these accounts (too much noise)
    mute_accounts:
      - "openai"  # too high volume, mostly product announcements

  hackernews:
    # Stories with these domains get auto-boosted
    boost_domains:
      - "github.com"
      - "langchain.dev"
      - "crewai.com"
      - "agpt.co"
      - "phidata.com"
      - "agno-agi.github.io"
    # Ignore these domains
    ignore_domains:
      - "news.ycombinator.com"  # meta posts

  reddit:
    # Additional subreddits
    extra_subreddits:
      - "artificial"
      - "OpenAI"
      - "LocalLLaMA"
      - "MachineLearning"
      - "LangChain"
      - "AutoGPT"
      - "AI_Agents"
      - "RAG"
    # Ignore these subreddits
    ignore_subreddits:
      - "ChatGPT"  # too consumer-focused
      - "singularity"  # too speculative

